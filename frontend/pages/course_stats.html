<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusVibe | Estatísticas do Curso</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/course_stats.css">
</head>
<body>

    <nav class="navbar glass">
        <div class="logo" onclick="window.location.href='dashboard.html'" style="cursor:pointer">Campus<span>Vibe</span></div>        
        
        <div class="selectors-group">
            <!-- Seletor de bloco -->
            <div class="selector-container">
                <label for="block-selector">Bloco</label>
                <select id="block-selector" class="glass-select">
                    <option value="" disabled selected>Carregando...</option>
                </select>
            </div>
            
            <!-- Seletor de cursos -->
            <div class="selector-container">
                <label for="course-selector">Curso</label>
                <select id="course-selector" class="glass-select" disabled>
                    <option value="" disabled selected>Selecione o bloco...</option>
                </select>
            </div>
        </div>

        <div class="nav-actions">
            <a href="dashboard.html" class="btn-back">
                <div class="btn-content">
                    <span class="icon">🏠</span>
                    <span class="text">Menu Principal</span>
                </div>
                <div class="btn-shine"></div>
            </a>
        </div>
    </nav>

    <main class="stats-container">
        <!-- Header com Emoji Dinâmico -->
        <header class="stats-header glass">
            <div class="vibe-emoji-container">
                <span id="vibe-emoji" class="floating-emoji">✨</span>
            </div>
            <div class="header-info">
                <h1 id="course-name">Carregando curso...</h1>
                <p>Análise de sentimentos e feedback da comunidade</p>
            </div>
        </header>

        <!-- Grid de Métricas -->
        <div class="metrics-grid">
            <div class="metric-card glass">
                <div class="metric-icon">📊</div>
                <div class="metric-data">
                    <h3 id="total-comments">0</h3>
                    <p>Total de Interações</p>
                </div>
            </div>
            <div class="metric-card glass highlights">
                <div class="metric-icon">🔥</div>
                <div class="metric-data">
                    <h3 id="top-vibe">Neutra</h3>
                    <p>Vibe Predominante</p>
                </div>
            </div>
        </div>

        <!-- Filtros por Vibe -->
        <section class="filters-section">
            <h3>Vibes registradas neste curso:</h3>
            <div class="emoji-filters" id="emoji-filters">
                <button class="filter-btn active" data-emoji="all">Todas</button>
                <!-- Preenchido via JS apenas com emojis existentes -->
            </div>
        </section>

        <!-- Feed de Comentários -->
        <section class="comments-feed">
            <div id="comments-container" class="comments-grid">
                <!-- Comentários injetados aqui -->
                <div class="loading-spinner"></div>
            </div>
        </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/course_stats.js"></script>
</body>
</html>
